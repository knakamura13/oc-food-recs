name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'knakamura/**']

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install -e '.[chain-scorer]'
      - run: npm run check
      - run: npm test
      - run: npm run test:pipeline

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Verify comment search with PostgreSQL
        run: npx vitest run src/lib/server/restaurants/comment-search.integration.test.ts
        env:
          COMMENT_SEARCH_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/e2e
      - run: npm run db:seed-e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci

  public-pages:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: public_pages_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/public_pages_fixture
      PUBLIC_RESTAURANT_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/public_pages_fixture
      PUBLIC_PAGES_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Verify publication and moderation with PostgreSQL
        run: npx vitest run src/lib/server/restaurants/public-restaurant.integration.test.ts
      - run: npx tsx scripts/seed-public-pages-fixtures.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/public-pages.spec.ts
