			/* Fallback metric overrides: scale Georgia / system-ui faces to DM Serif Display
			   and DM Sans so font-display:swap does not shift line boxes or average width.
			   Values from frequency-weighted glyph widths (Fontaine formula) against the
			   self-hosted woff2s. Preload hrefs above are unchanged. */
			@font-face {
				font-family: Georgia;
				src: local('Georgia');
				font-weight: 100 900;
				size-adjust: 101.02%;
				ascent-override: 102.55%;
				descent-override: 33.16%;
				line-gap-override: 0%;
			}
			@font-face {
				font-family: Arial;
				src: local('Arial');
				font-weight: 100 900;
				size-adjust: 106.74%;
				ascent-override: 92.94%;
				descent-override: 29.04%;
				line-gap-override: 0%;
			}
