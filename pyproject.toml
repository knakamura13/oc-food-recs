[project]
name = "oc-food-recs-pipeline"
version = "0.1.0"
description = "Reddit ingestion pipeline for OC Food Recs"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "psycopg[binary]>=3.2",
  "tqdm>=4.66",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
chain-scorer = [
  "duckdb>=1.4,<2",
  "ijson>=3.3,<4",
  "requests>=2.32,<3",
  "tldextract>=5.1,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
