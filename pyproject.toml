[project]
name = "oc-food-recs-pipeline"
version = "0.1.0"
description = "Reddit ingestion pipeline for OC Food Recs"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
